# 云服务器仅承载登录/注册鉴权服务（MySQL + Redis + Backend）
# 网站前端与业务后端仍部署在实验集群
services:
  mysql:
    image: mysql:8.0
    container_name: pv-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: photovoltaic
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - pv_mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:6.2
    container_name: pv-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "123456"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    image: eclipse-temurin:8-jre
    container_name: pv-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./photovoltaic-information.jar:/app/app.jar:ro
      - ./application-cloud.properties:/app/application.properties:ro
    command: ["java", "-jar", "/app/app.jar", "--spring.config.location=file:/app/application.properties"]
    # 安全组已放行 8787，对外仅暴露鉴权 API
    ports:
      - "8787:8113"

volumes:
  pv_mysql_data:
