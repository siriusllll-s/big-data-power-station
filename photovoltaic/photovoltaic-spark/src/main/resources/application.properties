spring.datasource.url=jdbc:mysql://slave2:3306/photovoltaic?serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456
logging.level.root=warn
spring.redis.database=6
spring.redis.host=slave1
spring.redis.port=6379
spring.redis.password=123456
spring.kafka.consumer.bootstrap-servers=master:9092
spring.kafka.producer.bootstrap-servers=master:9092
spring.kafka.bootstrap-servers=master:9092
spring.kafka.consumer.group-id=spark_etl
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
mybatis-plus.configuration.map-underscore-to-camel-case=true
